name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e . pytest pytest-asyncio
      - name: Lint (ruff, non-blocking on style-only rules)
        run: |
          pip install ruff
          ruff check src tests --output-format=github || true
      - name: Unit + integration tests
        run: pytest tests -q
      - name: Offline RAG evaluation (quality gate)
        run: python scripts/run_eval.py
      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: reports/

  container:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t crossmind:${{ github.sha }} .
      - name: Smoke test the image
        run: |
          docker run -d --name crossmind -p 8000:8000 crossmind:${{ github.sha }}
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/readyz > /dev/null; then echo ready; break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8000/readyz
          curl -fsS -X POST http://127.0.0.1:8000/api/v1/chat \
            -H 'Content-Type: application/json' -H 'X-API-Key: demo-key-alpha' \
            -d '{"message":"未拆封商品多久可以退货？"}' | head -c 400
          docker rm -f crossmind
